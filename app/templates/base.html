<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Autonomous Exam Proctoring & Grading Agent — ML-powered exam monitoring and automated grading">
    <title>{% block title %}Exam Proctoring Agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    <script src="/static/js/app.js"></script>
    <script>
        App.currentUser = {{ current_user | tojson }};
        App.authToken = "{{ token or '' }}";
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
