<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Exam Proctoring Agent</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
    <div class="login-page">
        <div class="login-card fade-in">
            <div class="login-header">
                <div class="login-logo">&#x1F393;</div>
                <h2>Create Account</h2>
                <p>Join the Exam Proctoring platform</p>
            </div>

            <div id="register-alert"></div>

            <form id="register-form" class="login-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-input" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="reg-username" class="form-input" placeholder="Choose a username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="your@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select id="reg-role" class="form-select">
                        <option value="student">Student</option>
                        <option value="examiner">Examiner</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-btn">
                    Create Account
                </button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="/login">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
    (async () => {
        if (localStorage.getItem('token')) {
            window.location.href = '/';
            return;
        }

        const form = document.getElementById('register-form');
        const btn = document.getElementById('reg-btn');
        const alertEl = document.getElementById('register-alert');

        function showAlert(message, type = 'error') {
            alertEl.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertEl.innerHTML = '', 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const data = await App.register({
                    full_name: document.getElementById('reg-fullname').value.trim(),
                    username: document.getElementById('reg-username').value.trim(),
                    email: document.getElementById('reg-email').value.trim(),
                    role: document.getElementById('reg-role').value,
                    password: document.getElementById('reg-password').value,
                });
                showAlert('Account created! Redirecting...', 'success');
                const role = data.user.role;
                if (role === 'student') window.location.href = '/student';
                else if (role === 'examiner' || role === 'admin') window.location.href = '/examiner';
                else window.location.href = '/';
            } catch (err) {
                showAlert(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    })();
    </script>
</body>
</html>
