<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results — Exam Proctoring Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">&#x1F393;</div>
                <div>
                    <h1>Proctoring Agent</h1>
                    <div class="version">v2.1.0</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <div class="nav-item" onclick="App.navigate('dashboard');window.location.href='/dashboard'">
                        <span class="icon">&#x1F4CA;</span> Dashboard
                    </div>
                    <div class="nav-item" onclick="window.location.href='/exam'">
                        <span class="icon">&#x1F4D6;</span> Take Exam
                    </div>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Results</div>
                    <div class="nav-item active">
                        <span class="icon">&#x1F4CA;</span> My Results
                    </div>
                    <div class="nav-item" onclick="window.location.href='/sessions'">
                        <span class="icon">&#x1F6E1;&#xFE0F;</span> Sessions
                    </div>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Account</div>
                    <div class="nav-item" onclick="App.navigate('profile');window.location.href='/dashboard'">
                        <span class="icon">&#x1F464;</span> Profile
                    </div>
                    <div class="nav-item" onclick="App.logout()">
                        <span class="icon">&#x279C;</span> Logout
                    </div>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <div class="user-name" id="user-name">User</div>
                        <div class="user-role" id="user-role">Student</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <h1 style="font-size:22px;font-weight:700;">My Results</h1>
            <p style="color:var(--text-secondary);font-size:14px;margin-top:2px;">Your exam results and proctoring summary</p>

            <div id="results-container">
                <div class="empty-state">
                    <div class="icon">&#x1F4CB;</div>
                    <h3>Loading results...</h3>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
    async function loadResults() {
        try {
            const data = await App.apiGet('/api/student/results');
            renderResults(data);
        } catch (e) {
            document.getElementById('results-container').innerHTML =
                `<div class="alert alert-error">Failed to load results: ${e.message}</div>`;
        }
    }

    function renderResults(data) {
        const container = document.getElementById('results-container');
        const results = data.results || data || [];

        if (!results.length) {
            container.innerHTML = '<div class="empty-state"><div class="icon">&#x1F4CB;</div><h3>No results yet</h3><p>Complete an exam to see results</p></div>';
            return;
        }

        container.innerHTML = results.map(r => {
            // Check if exam is released
            if (r.is_released === false || r.status === 'pending_release') {
                return `<div class="card mt-2">
                    <div class="card-header">
                        <div>
                            <div class="card-title">${r.exam_title || r.exam_id || 'Exam'}</div>
                            <div class="card-subtitle">${r.submitted_at ? new Date(r.submitted_at).toLocaleString() : ''}</div>
                        </div>
                        <span class="status-badge warning"><span class="status-dot"></span>Pending Release</span>
                    </div>
                    <div style="padding:16px 0;color:var(--text-secondary);font-size:14px;">
                        Your exam has been submitted and proctoring logs recorded. Scores and feedback will be visible once released by your examiner.
                    </div>
                </div>`;
            }

            const pct = r.percentage !== undefined ? r.percentage : (r.total_max ? Math.round((r.total_score / r.total_max) * 100) : 0);
            const grade = pct >= 90 ? 'A' : pct >= 75 ? 'B' : pct >= 60 ? 'C' : pct >= 40 ? 'D' : 'F';
            const gradeColor = pct >= 75 ? 'var(--success)' : pct >= 60 ? 'var(--info)' : pct >= 40 ? 'var(--warning)' : 'var(--danger)';

            return `<div class="card mt-2">
                <div class="card-header">
                    <div>
                        <div class="card-title">${r.exam_title || r.exam_id || 'Exam'}</div>
                        <div class="card-subtitle">${r.submitted_at ? new Date(r.submitted_at).toLocaleString() : ''}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:36px;font-weight:700;color:${gradeColor};">${grade}</div>
                        <div style="font-size:14px;color:var(--text-secondary);">${pct}%</div>
                    </div>
                </div>
                <div style="display:flex;gap:24px;margin-bottom:16px;">
                    <div>
                        <div style="font-size:12px;color:var(--text-muted);">Score</div>
                        <div style="font-size:20px;font-weight:600;">${r.total_score || 0} / ${r.total_max || 0}</div>
                    </div>
                    <div>
                        <div style="font-size:12px;color:var(--text-muted);">Questions</div>
                        <div style="font-size:20px;font-weight:600;">${r.answered || 0}</div>
                    </div>
                    <div>
                        <div style="font-size:12px;color:var(--text-muted);">Integrity Status</div>
                        <div style="font-size:16px;font-weight:600;color:${r.integrity_status === 'flagged' ? 'var(--danger)' : 'var(--success)'};padding-top:3px;">${r.integrity_status === 'flagged' ? '⚠️ Under Review' : r.integrity_status === 'cleared' ? '✅ Verified & Intact' : '📤 Submitted'}</div>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width:${pct}%;${pct < 40 ? 'background:var(--danger)' : ''}"></div>
                </div>
                <div style="margin-top:16px;display:flex;justify-content:flex-end;">
                    <button class="btn btn-sm btn-secondary" onclick="openAppealModal('${r.exam_id}', '${escapeHtml(r.exam_title || r.exam_id)}')">📝 File Grade Appeal</button>
                </div>
            </div>`;
        }).join('');
    }

    function openAppealModal(examId, examTitle) {
        window._activeAppealExamId = examId;
        const modal = document.getElementById('appeal-modal');
        document.getElementById('appeal-exam-name').textContent = examTitle;
        document.getElementById('appeal-reason').value = '';
        modal.style.display = 'flex';
    }

    function closeAppealModal() {
        document.getElementById('appeal-modal').style.display = 'none';
    }

    async function submitAppeal() {
        const reason = document.getElementById('appeal-reason').value.trim();
        if (!reason) {
            alert('Please provide a reason for your appeal.');
            return;
        }
        try {
            await App.apiPost('/api/student/appeal', {
                exam_id: window._activeAppealExamId,
                reason: reason,
            });
            alert('Your grade appeal has been submitted to your examiner for review.');
            closeAppealModal();
        } catch (e) {
            alert('Failed to submit appeal: ' + e.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadResults);
    </script>

    <!-- Grade Appeal Modal -->
    <div id="appeal-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;align-items:center;justify-content:center;">
        <div class="card" style="max-width:520px;width:90%;margin:20px;">
            <div class="card-header">
                <div class="card-title">📝 File Grade Appeal</div>
            </div>
            <p style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;">Submit a formal review request for <strong id="appeal-exam-name"></strong>.</p>
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;">Reason for Appeal / Questions Contested</label>
                <textarea id="appeal-reason" class="form-textarea" style="width:100%;min-height:120px;" placeholder="Describe why you believe your grade or proctoring flag should be re-evaluated..."></textarea>
            </div>
            <div class="form-actions" style="justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeAppealModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitAppeal()">Submit Appeal</button>
            </div>
        </div>
    </div>
</body>
</html>
