[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "autonomous-exam-proctoring"
version = "1.0.0"
description = "Autonomous Exam Proctoring & Grading Intelligence Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "sounddevice>=0.4.6",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "nltk>=3.8.0",
    "streamlit>=1.27.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.2",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "tests*"]
